syntax = "proto3";

message WalletTransaction {
  string hash = 1;
  int64 timestamp = 2;
  string type = 3;
  double amount = 4;
  string other_party = 5;
}

message WalletUtxo {
  string tx_hash = 1;
  uint32 output_index = 2;
  double amount = 3;
}

message WalletData {
  bytes private_key = 1;
  bytes public_key = 2;
  string address = 3;
  repeated WalletTransaction transactions = 4;
  repeated WalletUtxo utxos = 5;
}
