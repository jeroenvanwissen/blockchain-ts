# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript stays on 6.0.x: typescript-eslint (<6.1) and ts-jest (<7) load its JavaScript
      # compiler API, which TypeScript 7 doesn't have. Patch releases of 6.0 still come through.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker" # the Dockerfile's node base image
    directory: "/"
    schedule:
      interval: "weekly"
